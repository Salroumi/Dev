name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk SmsCleaner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sms-cleaner-apk
          path: SmsCleaner.apk

      # Publishes the APK as a direct download (no zip) at /releases/latest.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: منظّف الرسائل - إصدار ${{ github.run_number }}
          body: حمّل ملف SmsCleaner.apk وثبّته على الجوال.
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SmsCleaner.apk
